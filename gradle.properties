# Project-wide Gradle settings.
# See https://docs.gradle.org/current/userguide/build_environment.html

org.gradle.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8

# ─────────────────────────────────────────────────────────────────────────────
# PUBLISHED COORDINATES
# Every build script reads them from here — change these lines and nothing else
# needs to change.
# ─────────────────────────────────────────────────────────────────────────────
group=org.mifos
# Same version string the other merged paymenthub-ee-* component repos use.
version=2.0.0.mifos-SNAPSHOT

# ─────────────────────────────────────────────────────────────────────────────
# PLATFORM VERSIONS
# Only the BOM coordinates live here. Every library version the BOM manages comes
# from the BOM (org.mifos:paymenthub-ee-bom), published by paymenthub-ee-core.
# ─────────────────────────────────────────────────────────────────────────────
bomVersion=2.0.0-SNAPSHOT
# paymenthub-ee-core (the former ph-ee-connector-common). The BOM does not manage
# its own sibling, so the version has to be given explicitly.
coreVersion=2.0.0-SNAPSHOT

# ─────────────────────────────────────────────────────────────────────────────
# LIBRARY VERSIONS
# Test tooling that no imported BOM manages. Anything the Spring Boot BOM already
# governs (gson, rest-assured, lombok, hamcrest, awaitility, junit) must NOT be
# pinned here.
# ─────────────────────────────────────────────────────────────────────────────

# WireMock 3.x is the Jakarta line (groupId org.wiremock). It has to be the
# standalone (shaded) artifact: plain org.wiremock:wiremock wants Jetty 11 and
# dies under the BOM's Jetty 12, and org.wiremock:wiremock-jetty12 is built
# against Jetty ee10 12.0.16, gets 12.0.18, and then answers 500 to every admin
# call. The standalone jar carries its own Jetty and Jackson relocated inside.
wiremockVersion=3.13.1

# Cucumber. Used by both modules, so both read the same value from here.
cucumberVersion=7.20.1

# Google Truth assertions. Used by both modules.
truthVersion=1.4.4

# Error Prone core, used by mock-payment-schema. The plugin needs the checker
# library on its own configuration, and no imported BOM manages it.
errorproneVersion=2.20.0

# AWS SDK v1 for S3. Pinned because the BOM does not manage it. v1 is past end of
# support — moving mock-payment-schema to the v2 SDK is tracked separately.
awsSdkVersion=1.12.600

# CSV
opencsvVersion=5.9
commonsCsvVersion=1.12.0

# Apache Commons Validator
commonsValidatorVersion=1.9.0

# Generated Fineract client (package org.apache.fineract.client.*), published on
# Mifos JFrog mifosx-gradle-local. The old build asked for 2.0.4-SNAPSHOT from
# jfrog.sandbox.fynarfin.io, whose host no longer resolves.
#
# 2.0.3-gazelle and 2.0.4-gazelle are both missing PostSelfLoansLoanIdApprove and
# PostSelfLoansLoanIdDisburse, which the GSMA step definitions use.
# master-gazelle-1 was published the same day, three hours later, and has 1242
# model classes against 1240 — the same set plus those two.
openapiJavaClientVersion=master-gazelle-1
